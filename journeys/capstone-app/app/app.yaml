# Databricks Apps configuration for the capstone factory dashboard.
# Edit the LAKEBASE_* values to match your setup, then deploy with deploy.sh.
#
# Note: on Databricks Apps the runtime injects the app's Service Principal
# credentials, so there is NO LAKEBASE_PROFILE here (that is local-dev only).
# The app authenticates as its SP, which is why you run the grant step first.

command:
  - uvicorn
  - main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: LAKEBASE_PROJECT
    value: "factory"        # your project id from 00-setup
  - name: LAKEBASE_BRANCH
    value: "production"     # the branch the app serves (a shared, read-friendly branch)
  - name: LAKEBASE_SCHEMA
    value: "factory"
